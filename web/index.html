<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarthSiege 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 16px/1.4 system-ui, sans-serif; }
  #landing { max-width: 36em; margin: 0 auto; padding: 1em 16px; }
  footer { margin-top: 3em; text-align: center; font-size: 0.85em; }
  footer a { color: #8ab4f8; }
  #title { text-align: center; }
  #checks p { margin: 0.5em 0; }
  #settings { display: grid; grid-template-columns: max-content 1fr; gap: 0.9em 1.5em; align-items: center;
    padding: 1em 1.2em; background: #111; border: 1px solid #333; border-radius: 8px; }
  #settings > section { display: contents; }
  #settings > section[hidden] { display: none; }
  #settings > section > :not(h2) { grid-column: 2; }
  #settings > section > :empty:not(button):not(input) { display: none; }
  #settings p { margin: 0; }
  h2 { font-size: 1em; margin: 0; }
  @media (max-width: 30em) {
    #settings { grid-template-columns: 1fr; }
    #settings > section > :not(h2) { grid-column: 1; }
  }
  button { font: inherit; color: #eee; background: #2a2a2a; border: 1px solid #555; border-radius: 4px;
    padding: 0.35em 0.9em; cursor: pointer; }
  button:hover:not(:disabled) { background-color: #3a3a3a; }
  button:disabled { opacity: 0.5; cursor: default; }
  button.danger { background: #7a1f1f; border-color: #a33; }
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6em; }
  .flags { display: flex; gap: 0.8em; }
  .flag { width: 3.6em; height: 2.4em; padding: 0; background: center / cover no-repeat; opacity: 0.45;
    border: 2px solid transparent; }
  .flag[aria-pressed="true"] { opacity: 1; border-color: #eee; }
  .flag:hover:not(:disabled) { background-color: transparent; opacity: 0.8; }
  .flag:disabled { cursor: default; }
  .flag-G { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 5 3'><path d='M0,0h5v1h-5z'/><path d='M0,1h5v1h-5z' fill='%23d00'/><path d='M0,2h5v1h-5z' fill='%23ffce00'/></svg>"); }
  .flag-E { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 30'><clipPath id='t'><path d='M30,15h30v15zv15h-30zh-30v-15zv-15h30z'/></clipPath><path d='M0,0v30h60v-30z' fill='%23012169'/><path d='M0,0L60,30M60,0L0,30' stroke='%23fff' stroke-width='6'/><path d='M0,0L60,30M60,0L0,30' clip-path='url(%23t)' stroke='%23c8102e' stroke-width='4'/><path d='M30,0v30M0,15h60' stroke='%23fff' stroke-width='10'/><path d='M30,0v30M0,15h60' stroke='%23c8102e' stroke-width='6'/></svg>"); }
  .flag-F { background-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 3 2'><path d='M0,0h1v2h-1z' fill='%23002654'/><path d='M1,0h1v2h-1z' fill='%23fff'/><path d='M2,0h1v2h-1z' fill='%23ce1126'/></svg>"); }
  .info { display: inline-block; width: 1.2em; height: 1.2em; margin-left: 0.4em; border: 1px solid #888;
    border-radius: 50%; font-size: 0.8em; line-height: 1.2em; text-align: center; color: #aaa; cursor: help; }
  #saves .actions { position: relative; }
  .bubble { position: absolute; bottom: calc(100% + 0.6em); left: 0; z-index: 1; box-sizing: border-box; width: min(24em, 100%);
    padding: 0.8em; background: #1c1c1c; border: 1px solid #666; border-radius: 6px; box-shadow: 0 4px 16px #000; }
  .bubble[hidden] { display: none; }
  .bubble p { margin: 0 0 0.8em; }
  .bubble button { margin-right: 0.5em; }
  #volume input[type=range] { flex: 1; min-width: 8em; }
  #gamefiles progress { flex: 1; min-width: 8em; accent-color: #3a8a48; }
  #gamefiles progress[hidden], #gamefiles button[hidden] { display: none; }
  #start { margin-top: 1.5em; text-align: center; }
  button.start { width: 5em; height: 3em; padding: 0; background: #1f5a2a; border-color: #3a8a48; border-radius: 8px; font-size: 1.4em; }
  button.start:hover:not(:disabled) { background-color: #2a7236; }
  button.start::before { content: ""; display: inline-block; margin-left: 0.2em; vertical-align: middle;
    border-style: solid; border-width: 0.45em 0 0.45em 0.75em; border-color: transparent transparent transparent currentColor; }
  #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
  #game[hidden] { display: none; }
  #screen { image-rendering: pixelated; }
  #movie { position: absolute; }
</style>
</head>
<body>
<!-- The landing page's steps (docs/web_build.md section 13): the checks run first; the other
     steps stay hidden until they pass. app.js is the page module; the flags are drawn here. -->
<main id="landing">
  <h1 id="title">EarthSiege 2</h1>
  <section id="checks" aria-live="polite"></section>
  <div id="steps" hidden>
    <div id="settings">
      <section id="language" hidden></section>
      <section id="gamefiles" hidden></section>
      <section id="volume" hidden></section>
      <section id="saves" hidden></section>
    </div>
    <section id="start" hidden></section>
  </div>
  <footer><a href="https://github.com/Highlife1911/es2-public">Source code on GitHub</a></footer>
</main>
<!-- The game container (sections 9 and 11): the canvas, the movie over it, the message box. -->
<div id="game" hidden>
  <canvas id="screen"></canvas>
  <video id="movie" hidden playsinline></video>
  <dialog id="message"></dialog>
</div>
<noscript>The game needs JavaScript.</noscript>
<script type="module" src="app.js"></script>
</body>
</html>
